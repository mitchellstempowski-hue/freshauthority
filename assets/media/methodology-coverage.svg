<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-label="FreshAuthority methodology: FMCSA public filings are pulled daily, built into grants, renewals and lapses files, and delivered to subscriber inboxes by 6 AM ET. Coverage: October 2026 new authority grants by top state — Texas 759, California 650, Florida 513, Illinois 410, Ohio 346, Pennsylvania 332, Georgia 259, North Carolina 218, of 6,375 across the 50 states.">
<rect width="1160" height="620" fill="#ffffff"/>
<text x="30" y="32" font-size="21" font-weight="700" fill="#16211a">How FreshAuthority builds the daily files — and where the carriers are</text>
<rect x="30" y="52" width="252" height="86" rx="10" fill="#10331d"/><text x="44" y="82" font-size="17" font-weight="700" fill="#ffffff">FMCSA public filings</text><text x="44" y="106" font-size="12.5" fill="#cfe3d4">Licensing &amp; Insurance + census</text><text x="44" y="122" font-size="12.5" fill="#cfe3d4">records, published daily</text><text x="286" y="103" font-size="24" fill="#10331d">→</text><rect x="312" y="52" width="252" height="86" rx="10" fill="#10331d"/><text x="326" y="82" font-size="17" font-weight="700" fill="#ffffff">Daily pull — by 6 AM ET</text><text x="326" y="106" font-size="12.5" fill="#cfe3d4">Every new for-hire authority</text><text x="326" y="122" font-size="12.5" fill="#cfe3d4">grant, deduplicated by USDOT</text><text x="568" y="103" font-size="24" fill="#10331d">→</text><rect x="594" y="52" width="252" height="86" rx="10" fill="#10331d"/><text x="608" y="82" font-size="17" font-weight="700" fill="#ffffff">Three files built</text><text x="608" y="106" font-size="12.5" fill="#cfe3d4">Grants · renewals due in 60 days ·</text><text x="608" y="122" font-size="12.5" fill="#cfe3d4">lapsed-liability triggers</text><text x="850" y="103" font-size="24" fill="#10331d">→</text><rect x="876" y="52" width="252" height="86" rx="10" fill="#10331d"/><text x="890" y="82" font-size="17" font-weight="700" fill="#ffffff">In subscriber inboxes</text><text x="890" y="106" font-size="12.5" fill="#cfe3d4">Full phone + email on the paid</text><text x="890" y="122" font-size="12.5" fill="#cfe3d4">files; watchlist checked daily</text>
<text x="30" y="176" font-size="17" font-weight="700" fill="#16211a">Coverage — new authority grants by state, October 2026 (complete month, Formation Index): 6,375 across the 50 states</text>
<text x="30" y="213" font-size="16" fill="#16211a">Texas (TX)</text><rect x="240" y="196" width="560" height="24" rx="4" fill="#1d6a3a"/><text x="812" y="213" font-size="16" font-weight="700" fill="#16211a">759</text><text x="30" y="249" font-size="16" fill="#16211a">California (CA)</text><rect x="240" y="232" width="479" height="24" rx="4" fill="#1d6a3a"/><text x="731" y="249" font-size="16" font-weight="700" fill="#16211a">650</text><text x="30" y="285" font-size="16" fill="#16211a">Florida (FL)</text><rect x="240" y="268" width="378" height="24" rx="4" fill="#1d6a3a"/><text x="630" y="285" font-size="16" font-weight="700" fill="#16211a">513</text><text x="30" y="321" font-size="16" fill="#16211a">Illinois (IL)</text><rect x="240" y="304" width="302" height="24" rx="4" fill="#1d6a3a"/><text x="554" y="321" font-size="16" font-weight="700" fill="#16211a">410</text><text x="30" y="357" font-size="16" fill="#16211a">Ohio (OH)</text><rect x="240" y="340" width="255" height="24" rx="4" fill="#1d6a3a"/><text x="507" y="357" font-size="16" font-weight="700" fill="#16211a">346</text><text x="30" y="393" font-size="16" fill="#16211a">Pennsylvania (PA)</text><rect x="240" y="376" width="244" height="24" rx="4" fill="#1d6a3a"/><text x="496" y="393" font-size="16" font-weight="700" fill="#16211a">332</text><text x="30" y="429" font-size="16" fill="#16211a">Georgia (GA)</text><rect x="240" y="412" width="191" height="24" rx="4" fill="#1d6a3a"/><text x="443" y="429" font-size="16" font-weight="700" fill="#16211a">259</text><text x="30" y="465" font-size="16" fill="#16211a">North Carolina (NC)</text><rect x="240" y="448" width="160" height="24" rx="4" fill="#1d6a3a"/><text x="412" y="465" font-size="16" font-weight="700" fill="#16211a">218</text>
<text x="30" y="500" font-size="13.5" fill="#5c6a5f">Source: FMCSA public records via FreshAuthority's New Authority Formation Index, October 2026 edition.</text>
<text x="30" y="520" font-size="13.5" fill="#5c6a5f">Counts are authority grants as filed — not trucks, drivers, or active businesses. FreshAuthority is not affiliated with FMCSA.</text>
